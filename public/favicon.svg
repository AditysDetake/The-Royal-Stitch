<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2343" />
      <stop offset="100%" stop-color="#4A1022" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="40%" stop-color="#E5B84D" />
      <stop offset="100%" stop-color="#B88218" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECC66D" />
      <stop offset="50%" stop-color="#FFF5CC" />
      <stop offset="100%" stop-color="#D49E2E" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#1A040A" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Luxury Royal Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.2" />
  <circle cx="32" cy="32" r="26.8" fill="none" stroke="rgba(229,184,77,0.35)" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Master Tailor Scissors -->
  <g filter="url(#shadow)">
    <!-- Left Loop to Right Blade -->
    <path d="M 21.5 40
             C 16 40 12 44.5 12 50
             C 12 55.5 16.5 59 22 59
             C 27.5 59 31 55 30.5 49
             L 32 34
             L 47 13
             C 47.5 12.2 46.5 12 45.8 12.6
             L 32 33
             L 26 43
             C 25 41.5 23.5 40 21.5 40 Z
             M 21.5 44
             C 23.5 44 26 46 26 50
             C 26 53.5 24 55.5 21.5 55.5
             C 18.5 55.5 16 53 16 49.5
             C 16 46 18.5 44 21.5 44 Z"
          fill="url(#goldGrad)" fill-rule="evenodd"/>

    <!-- Right Loop to Left Blade -->
    <path d="M 42.5 40
             C 48 40 52 44.5 52 50
             C 52 55.5 47.5 59 42 59
             C 36.5 59 33 55 33.5 49
             L 32 34
             L 17 13
             C 16.5 12.2 17.5 12 18.2 12.6
             L 32 33
             L 38 43
             C 39 41.5 40.5 40 42.5 40 Z
             M 42.5 44
             C 40.5 44 38 46 38 50
             C 38 53.5 40 55.5 42.5 55.5
             C 45.5 55.5 48 53 48 49.5
             C 48 46 45.5 44 42.5 44 Z"
          fill="url(#bladeGrad)" fill-rule="evenodd"/>

    <!-- Pivot Screw -->
    <circle cx="32" cy="34" r="2.8" fill="url(#goldGrad)" stroke="#55152A" stroke-width="0.8"/>
    <circle cx="32" cy="34" r="1.1" fill="#FFF9E6"/>
  </g>
</svg>

